name: CI - Postgres tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create .env for Docker Compose
        run: cp .env.example .env

      - name: Make CI script executable
        run: chmod +x ci/run_postgres_tests.sh

      - name: Run CI helper script
        env:
          # These are used by the python tests
          DATABASE_URL: postgresql+asyncpg://safeledger:safeledger@localhost:5432/safeledger_test
          SECRET_KEY: test-secret-key-123
        run: ./ci/run_postgres_tests.sh
